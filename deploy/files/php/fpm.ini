; AstroLabe (deploy/files/php/fpm.ini) → /etc/php/__PHP_VERSION__/fpm/conf.d/90-astrolabe.ini
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Deploys update the code in place (deploy/deploy.sh): OPcache sees changed files
; within two seconds, so PHP-FPM is never restarted for a new version.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
