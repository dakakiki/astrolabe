; AstroLabe (deploy/files/php/fpm-pool.conf): the app's own PHP-FPM pool. It runs as
; __RUN_USER__, which can write only storage/ and bootstrap/cache — the code belongs
; to __DEPLOY_USER__, so a fault in a web request cannot change the program.
[astrolabe]
user = __RUN_USER__
group = __RUN_USER__
listen = __PHP_SOCKET__
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; CX33 (8 GB): MariaDB keeps ~3 GB, each worker needs well under 100 MB.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
request_terminate_timeout = 130s

; PHP's own errors go to the FPM log (/var/log/php__PHP_VERSION__-fpm.log, 14 days);
; the app writes its own log in storage/logs.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
; Client files up to ATTACHMENTS_MAX_MB (100 MB); Nginx allows the same.
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 110M

env[PATH] = /usr/local/bin:/usr/bin:/bin
