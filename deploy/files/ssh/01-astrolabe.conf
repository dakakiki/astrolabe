# AstroLabe (deploy/files/ssh/01-astrolabe.conf) → /etc/ssh/sshd_config.d/
# Read before the image's own files there (the first value wins): keys only.
# Root may sign in with a key while the server is set up; `provision.sh finish`
# switches it off.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin __ROOT_LOGIN__
MaxAuthTries 4
X11Forwarding no
AllowAgentForwarding no
