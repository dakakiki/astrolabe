# AstroLabe (deploy/files/nginx/https.conf): the app and the client portal are one
# Laravel application on two hosts. The app tells them apart by the host name: on
# the portal host the app's own routes answer 404 (RejectOnPortalHost), not Nginx.

server {
    listen __HTTPS_PORT__ ssl http2;
    listen [::]:__HTTPS_PORT__ ssl http2;
    server_name __APP_HOST__ __PORTAL_HOST__;

    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    include __NGINX_SNIPPETS__/astrolabe-tls.conf;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    access_log __NGINX_LOG_DIR__/astrolabe-access.log;
    error_log __NGINX_LOG_DIR__/astrolabe-error.log;

    # Client files up to ATTACHMENTS_MAX_MB (100 MB) plus the form around them;
    # PHP-FPM allows the same (deploy/files/php/fpm-pool.conf).
    client_max_body_size 110m;

    # The app sets the security headers (CSP with a nonce, HSTS, frame options …)
    # on every page and API answer itself; nothing is added here for them.

    # Vite's build: hashed file names, so a year in the browser cache. This is the
    # only place where .js files are served as files. The portal's /sw.js,
    # /manifest.webmanifest and /offline are not files: they come from PHP
    # (routes/portal-pwa.php, Phase 9c) through "location /" below — never add a
    # location for .js or .webmanifest without that fallback.
    location ^~ /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # A file in public/ (favicon, icons, robots.txt), otherwise the app.
    location / {
        try_files $uri /index.php?$query_string;
    }

    # The front controller is the only PHP that runs.
    location = /index.php {
        include __NGINX_SNIPPETS__/astrolabe-php.conf;
    }

    location ~ \.php$ {
        return 404;
    }

    # .htaccess and any other dot file.
    location ~ /\. {
        return 404;
    }
}
