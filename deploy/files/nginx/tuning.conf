# AstroLabe (deploy/files/nginx/tuning.conf), in Nginx's http block. Ubuntu's
# nginx.conf already switches gzip on; only what it leaves commented out is here.
server_tokens off;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
