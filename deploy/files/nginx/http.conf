# AstroLabe (deploy/files/nginx/http.conf): plain HTTP for the app and the portal —
# Let's Encrypt's checks are answered, everything else goes to HTTPS.

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name __APP_HOST__ __PORTAL_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
