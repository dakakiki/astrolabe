# AstroLabe (deploy/files/nginx/default.conf): requests for any other name — the
# bare IP address, scanners — get nothing, not even a certificate.

server {
    listen __HTTP_PORT__ default_server;
    listen [::]:__HTTP_PORT__ default_server;
    server_name _;

    return 444;
}

server {
    listen __HTTPS_PORT__ ssl http2 default_server;
    listen [::]:__HTTPS_PORT__ ssl http2 default_server;
    server_name _;

    include __NGINX_SNIPPETS__/astrolabe-tls.conf;
    ssl_reject_handshake on;
}
