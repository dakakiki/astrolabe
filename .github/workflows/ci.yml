name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Target MariaDB LTS branch (docs/spec/03).
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: astrolabe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: astrolabe_test
      DB_USERNAME: root
      DB_PASSWORD: root
      # Linux swetest (Phase 8c): built only where the source URL is known. It is a secret
      # because the URL names the library's author (licence contract, clause 9).
      HAS_SWISSEPH_SOURCE: ${{ secrets.SWISSEPH_SOURCE != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd only for the tests that make images (metadata stripping, Phase 8a).
          extensions: mbstring, intl, pdo_mysql, bcmath, zip, gd, sodium
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      # Known vulnerabilities in what runs in production (Phase 8a security review).
      # Development-only npm tools are left out: they never reach the server or the browser.
      - name: Audit PHP dependencies
        run: composer audit --no-dev

      - name: Audit Node dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP style (Pint)
        run: vendor/bin/pint --test

      - name: Check frontend style (Prettier)
        run: npm run format:check

      - name: Run frontend tests (Vitest)
        run: npm test

      - name: Build frontend
        run: npm run build

      # The Swiss Ephemeris built from its official sources at a pinned commit
      # (scripts/build-swetest.sh), so the reference tests run on the real engine.
      - name: Cache swetest
        id: swetest-cache
        if: env.HAS_SWISSEPH_SOURCE == 'true'
        uses: actions/cache@v6
        with:
          path: .swisseph
          key: swetest-${{ runner.os }}-${{ hashFiles('scripts/build-swetest.sh') }}

      - name: Build swetest
        if: env.HAS_SWISSEPH_SOURCE == 'true' && steps.swetest-cache.outputs.cache-hit != 'true'
        env:
          SWISSEPH_SOURCE: ${{ secrets.SWISSEPH_SOURCE }}
        run: bash scripts/build-swetest.sh .swisseph

      - name: Run tests
        env:
          # Where present, SwissEphemerisReferenceTest, HouseAccuracyTest and
          # SkyCalendarAccuracyTest use them; elsewhere they are skipped.
          SWETEST_PATH: ${{ github.workspace }}/.swisseph/swetest
          EPHEMERIS_PATH: ${{ github.workspace }}/.swisseph/ephe
        run: php artisan test

      - name: Time the engine on Linux
        if: env.HAS_SWISSEPH_SOURCE == 'true'
        env:
          SWETEST_PATH: ${{ github.workspace }}/.swisseph/swetest
          EPHEMERIS_PATH: ${{ github.workspace }}/.swisseph/ephe
          EPHEMERIS_ENGINE: swiss
          CACHE_STORE: array
        run: php artisan ephemeris:benchmark --runs=5
